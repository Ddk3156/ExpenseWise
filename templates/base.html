<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ExpenseWise{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script>/* apply saved theme before first paint (no flash) */
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set ep = request.endpoint or '' %}
<header class="top">
  <a class="brand" href="{{ url_for('dashboard', month=nav_month) }}">💰 Expense<span>Wise</span></a>
  <nav>
    <a href="{{ url_for('dashboard', month=nav_month) }}" class="{{ 'active' if ep == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('transactions', month=nav_month) }}" class="{{ 'active' if ep in ('transactions', 'tx_new', 'tx_edit') }}">Transactions</a>
    <a href="{{ url_for('categories') }}" class="{{ 'active' if ep == 'categories' }}">Categories</a>
    <a href="{{ url_for('budgets', month=nav_month) }}" class="{{ 'active' if ep == 'budgets' }}">Budgets</a>
    <a href="{{ url_for('report', month=nav_month) }}" class="{{ 'active' if ep == 'report' }}">Report</a>
    <a href="{{ url_for('analytics_page') }}" class="{{ 'active' if ep == 'analytics_page' }}">Analytics</a>
  </nav>
  <a class="btn primary add-label" href="{{ url_for('tx_new') }}">+ Add</a>
  <a class="gullak-link {{ 'active' if ep.startswith('gullak') }}" href="{{ url_for('gullak.index') }}" title="My Gullak (savings boxes)">🐷</a>
  <button class="theme-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script>
  document.getElementById('themeBtn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    if (window.Chart) location.reload();          // redraw charts in the new colours
  };
  // success + warning messages fade away; errors stay until you leave the page
  setTimeout(() => document.querySelectorAll('.flash.success,.flash.warning').forEach(f => {
    f.style.opacity = 0; setTimeout(() => f.remove(), 450); }), 6000);
</script>
</body>
</html>
