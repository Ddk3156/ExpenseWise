<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ExpenseWise{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('dashboard', month=nav_month) }}">₹ ExpenseWise</a>
  <nav>
    <a href="{{ url_for('dashboard', month=nav_month) }}">Dashboard</a>
    <a href="{{ url_for('transactions', month=nav_month) }}">Transactions</a>
    <a href="{{ url_for('categories') }}">Categories</a>
    <a href="{{ url_for('budgets', month=nav_month) }}">Budgets</a>
    <a href="{{ url_for('report', month=nav_month) }}">Report</a>
  </nav>
  <a class="btn primary" href="{{ url_for('tx_new') }}">+ Add transaction</a>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
